name: WordMate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wordmate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wordmate/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:integration
