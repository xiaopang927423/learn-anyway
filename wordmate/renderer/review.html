<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="review-body">
  <header class="review-head">
    <div class="progress"><div id="bar"></div></div>
    <span id="counter" class="counter">0 / 0</span>
  </header>
  <main id="card"></main>
  <div id="actions" class="review-actions"></div>
  <footer class="keyhint">
    <span><kbd>空格</kbd>翻面</span>
    <span><kbd>1</kbd>不认识</span>
    <span><kbd>2</kbd>模糊</span>
    <span><kbd>3</kbd>认识</span>
  </footer>
  <div id="toast"></div>
  <script src="ui.js"></script>
  <script src="forms.js"></script>
  <script src="memory.js"></script>
  <script src="review.js"></script>
</body>
</html>
