<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordMate PDF 双语阅读</title><link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="pdf-reader.css"></head><body>
<header><div class="brand">WordMate <span>PDF 双语对照 · 0.6.1</span></div><button id="return-original" hidden>返回原 PDF</button><button id="change-file">更换文件</button><div class="open" id="open-controls"><label class="file-button">打开本地 PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><input id="url" type="url" aria-label="PDF 网络地址" placeholder="粘贴 PDF 地址"><button id="open-url">打开地址</button></div></header>
<nav aria-label="阅读控制"><button id="previous" disabled>上一页</button><label>页码 <input id="page-number" type="number" value="1" min="1" disabled></label><span id="page-count">/ 0</span><button id="next" disabled>下一页</button><label>缩放 <select id="zoom"><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><label>翻译成 <select id="target"><option value="zh">简体中文</option><option value="en">英文</option></select></label><button id="translate-page" class="primary" disabled>翻译当前页</button><button id="stop">停止</button><button id="restore">恢复原文</button><label><input id="auto" type="checkbox">翻页时自动翻译</label><label>右侧 <select id="mode"><option value="bilingual">双语对照</option><option value="translated">仅译文</option></select></label><button id="translate-selection">翻译选区</button></nav>
<p id="status" role="status" aria-live="polite">左侧保留原版页面，右侧按段落双语阅读。文件在本机解析，仅待翻译文字发送到已配置的模型。</p>
<main><section id="original" aria-label="PDF 原版页面"><div id="page"><canvas id="canvas"></canvas><div id="text-layer" class="textLayer"></div><div id="highlights"></div></div><p id="empty">支持有文字层的 PDF。扫描件和图片 OCR 将在后续版本提供。</p></section><section id="reading" aria-label="对应段落译文"><div id="paragraphs"></div></section></main>
<aside id="selection-panel" hidden aria-label="选区翻译"><button id="close-selection">关闭</button><div id="selection-result"></div><button id="add-word" hidden>加入生词本</button></aside>
<script type="module" src="pdf-reader.mjs"></script></body></html>
