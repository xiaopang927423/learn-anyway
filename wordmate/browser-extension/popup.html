<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>WordMate 网页阅读</title><style>
*{box-sizing:border-box}body{width:320px;font:14px/1.6 system-ui;margin:0;padding:18px;color:#182235;background:#f8fbff}h2{font-size:18px;margin:0 0 14px}button,select{width:100%;font:inherit;padding:10px;margin:5px 0;border:1px solid #dce3ef;border-radius:9px;background:white;color:#23456b;cursor:pointer}button.primary{background:#246bce;color:white;border-color:#246bce}.row{display:flex;gap:8px}.row button{flex:1}.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}input{width:18px;height:18px;accent-color:#246bce}p{font-size:12px;color:#64748b;margin:6px 0}#status{white-space:pre-wrap;color:#b42318}a{color:#246bce}label{font-weight:600}hr{border:0;border-top:1px solid #dce3ef;margin:12px 0}
</style></head><body><h2>WordMate 网页阅读</h2><label for="readingMode">阅读模式</label><select id="readingMode"><option value="bilingual">双语对照 · 一段原文，一段译文</option><option value="translated">仅译文 · 覆盖原文直接阅读</option></select><label for="target">翻译成</label><select id="target"><option value="zh">简体中文</option><option value="en">英文</option></select><button id="page" class="primary">翻译页面正文</button><button id="activate">启用划词 / 悬停翻译</button><button id="selection">翻译选中文本</button><div class="row"><button id="cancel">停止翻译</button><button id="restore">恢复原文</button></div><hr><label class="switch" for="thinkingEnabled">Thinking 深度思考<input id="thinkingEnabled" type="checkbox" disabled></label><p>正文对照保留导航、名称及路径。Thinking 与桌面设置同步；单词可在浮层加入生词本。</p><p id="status" role="status"></p><a href="help.html" target="_blank">安装与使用帮助</a><script src="popup.js"></script></body></html>
